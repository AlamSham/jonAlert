steps:
  # 1. Build Docker image for Next.js Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sarkaripulse-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sarkaripulse-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  # 2. Push Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sarkaripulse-frontend:$COMMIT_SHA'

  # 3. Deploy to Cloud Run (sarkaripulse-frontend in asia-south2)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sarkaripulse-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sarkaripulse-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-south2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/sarkaripulse-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
